apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-worker
  template:
    metadata:
      labels:
        app: backend-worker
    spec:
      restartPolicy: Always
      containers:
        - name: backend-worker
          image: rajlodhi09/backend-worker:4d2a6b644390601dc5cf5830c0bc5cb1612cf554
          imagePullPolicy: Always
